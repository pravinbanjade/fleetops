apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-cron
  namespace: NAMESPACE
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: busybox:1.37
              command: ["sh", "-c", "date"]
