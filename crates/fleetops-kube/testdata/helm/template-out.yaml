---
# Source: demo/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel
spec:
  replicas: 1
  selector: {matchLabels: {app: rel}}
  template:
    metadata: {labels: {app: rel}}
    spec:
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
---
# Source: demo/templates/hook.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rel-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: m, image: busybox:1.37, command: [echo, hi]}]

