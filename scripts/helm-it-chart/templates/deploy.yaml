apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.note }}
  annotations:
    fleetops.dev/note: {{ .Values.note | quote }}
  {{- end }}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}}}
    spec:
      containers:
        - name: main
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
