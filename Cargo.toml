[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[workspace.dependencies]
fleetops-core = { path = "crates/fleetops-core" }
fleetops-store = { path = "crates/fleetops-store" }
fleetops-api = { path = "crates/fleetops-api" }
fleetops-docker = { path = "crates/fleetops-docker" }
fleetops-tunnel = { path = "crates/fleetops-tunnel" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jsonschema = { version = "0.58", default-features = false }
mime_guess = "2"
rand = "0.8"
rcgen = "0.13"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = "5.5"
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
yamux = "0.14"

# Release binaries ship without debug symbols (the image is about 20 MB).
[profile.release]
strip = true
