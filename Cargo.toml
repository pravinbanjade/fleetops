[workspace]
resolver = "2"
members = ["crates/*", "ee/crates/*", "ee/tools/*"]
# `cargo build` and `cargo test` cover the Community edition only.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
fleetops-core = { path = "crates/fleetops-core" }
fleetops-store = { path = "crates/fleetops-store" }
fleetops-api = { path = "crates/fleetops-api" }
fleetops-docker = { path = "crates/fleetops-docker" }
fleetops-tunnel = { path = "crates/fleetops-tunnel" }
fleetops-kube = { path = "crates/fleetops-kube" }
fleetops-ee = { path = "ee/crates/fleetops-ee" }

aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bollard = "0.21"
bytes = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "tokio"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws", "runtime"] }
jiff = "0.2.37"
jsonschema = { version = "0.58", default-features = false }
mime_guess = "2"
rand = "0.8"
rcgen = "0.13"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.29"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = "5.5"
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
yamux = "0.14"

# Release binaries ship without debug symbols (the image is about 20 MB).
[profile.release]
strip = true
