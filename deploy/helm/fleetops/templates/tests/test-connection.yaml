apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleetops.fullname" . }}-test
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.37
      command:
        - wget
        - -qO-
        - http://{{ include "fleetops.fullname" . }}:{{ .Values.service.httpPort }}/api/v1/health
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
