{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleetops.fullname" . }}
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleetops.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
        {{- if .Values.tls.enabled }}
        - port: https
        {{- end }}
{{- end }}
