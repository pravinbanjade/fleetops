{{- if .Values.rbac.create }}
{{- if not .Values.serviceAccount.automount }}
{{- fail "rbac.create=true needs serviceAccount.automount=true: FleetOps reads the cluster with its service account token" }}
{{- end }}
# Lets FleetOps manage the cluster it runs in as the "local" environment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fleetops.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole | required "rbac.clusterRole is required with rbac.create" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fleetops.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
