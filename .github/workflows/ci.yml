name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml (stable, with rustfmt and clippy).
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test

  docker-it:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: make test-docker

  web:
    name: Web (typecheck, lint, test, API client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make test-web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  rss:
    name: Idle memory (50 containers, under 50 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make rss-bench

  image:
    name: Container images (amd64 and arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Both platforms, to prove they build. The result stays in the cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
      # The runner's own platform again (cache hits), loaded to smoke-test.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: fleetops:ci
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64
          load: true
          tags: fleetops-agent:ci
          cache-from: type=gha
      - run: make image-smoke IMAGE=fleetops:ci
      - run: make agent-smoke IMAGE=fleetops:ci AGENT_IMAGE=fleetops-agent:ci
