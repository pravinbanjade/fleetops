name: CI

# Pushes to main and pull requests. Every job runs the same make target a
# developer runs locally; the runner's own Docker daemon serves the tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make lint
      - run: make test

  rust-ee:
    name: Rust, Enterprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make test-ee

  web:
    name: Web (typecheck, lint, test, API client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: make test-web

  web-ee:
    name: Web, Enterprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: make test-web-ee

  # Community code must not depend on ee/.
  editions:
    name: Edition boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make check-editions

  docker-it:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make test-docker

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  e2e-ee:
    name: End-to-end, Enterprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: make e2e-ee
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ee-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  kube:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
          kube-tools: "true"
          free-disk: "true"
      - run: make test-kube
      - run: make e2e-kube
      - run: make rss-bench KUBE_IT_RSS="$GITHUB_WORKSPACE/target/kube-it"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kube-report
          path: web/playwright-report/
          retention-days: 7

  # The agent's Kubernetes mode with the real images, on its own kind
  # cluster. Kept apart from kube: the image build compiles the workspace
  # again inside BuildKit, and next to kube's target/ the disk fills.
  agent-kube:
    name: Agent in Kubernetes (real images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          web: "false"
          kube-tools: "true"
          free-disk: "true"
      - run: make image IMAGE=fleetops:dev PLATFORMS=linux/amd64
      - run: make image-agent AGENT_IMAGE=fleetops-agent:dev PLATFORMS=linux/amd64
      - run: make agent-kube-smoke

  # Idle memory: 50 containers, under 50 MiB.
  rss:
    name: Idle memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make rss-bench

  # Both platforms, to prove they build (the result stays in the cache),
  # then the runner's own platform again, loaded to smoke-test.
  images:
    name: Container images (amd64 and arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          web: "false"
          free-disk: "true"
      # No QEMU: the Dockerfile cross-compiles on the build platform.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          build-args: EDITION=ee
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: fleetops:ci
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64
          load: true
          tags: fleetops-agent:ci
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          build-args: EDITION=ee
          platforms: linux/amd64
          load: true
          tags: fleetops-ee:ci
          cache-from: type=gha
      - run: make image-smoke IMAGE=fleetops:ci
      - run: make image-smoke IMAGE=fleetops-ee:ci
      - run: make agent-smoke IMAGE=fleetops:ci AGENT_IMAGE=fleetops-agent:ci
