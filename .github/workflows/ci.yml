name: CI

# Pushes to main and pull requests. Every job runs the same make target a
# developer runs locally; the runner's own Docker daemon serves the tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make lint
      - run: make test

  ldap:
    name: LDAP (OpenLDAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make test-ldap

  web:
    name: Web (typecheck, lint, test, API client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: make test-web

  helm-chart:
    name: Helm chart (lint, plain manifest drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - run: make helm-lint
      - run: make k8s-manifest
      - name: Check deploy/kubernetes/fleetops.yaml is up to date
        run: git diff --exit-code deploy/kubernetes/ || { echo "run make k8s-manifest and commit the result" >&2; exit 1; }

  editions:
    name: Edition boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make check-editions

  docker-it:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: make test-docker

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  kube:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
          kube-tools: "true"
          free-disk: "true"
      - run: make test-kube
      - run: make e2e-kube
      - run: make rss-bench KUBE_IT_RSS="$GITHUB_WORKSPACE/target/kube-it"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kube-report
          path: web/playwright-report/
          retention-days: 7

  # The kube job runs the Helm suite with Helm 3, the oldest supported
  # (3.13+); this runs it again with Helm 4, whose dry run differs.
  helm-4:
    name: Helm 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          web: "false"
          kube-tools: "true"
          helm-version: "4.3.0"
      - run: make kind-up
      - run: PATH="$PWD/scripts:$PATH" FLEETOPS_KUBE_IT="$PWD/target/kube-it" cargo test -p fleetops-kube --features kube-it --test helm_it -- --test-threads=4

  # The agent's Kubernetes mode with the real images, on its own kind
  # cluster. Kept apart from kube: the image build compiles the workspace
  # again inside BuildKit, and next to kube's target/ the disk fills.
  agent-kube:
    name: Agent in Kubernetes (real images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          web: "false"
          kube-tools: "true"
          free-disk: "true"
      - run: make image IMAGE=fleetops:dev PLATFORMS=linux/amd64
      - run: make image-agent AGENT_IMAGE=fleetops-agent:dev PLATFORMS=linux/amd64
      - run: make agent-kube-smoke

  # Idle memory: 50 containers, under 50 MiB.
  rss:
    name: Idle memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make rss-bench

  # Both platforms, to prove they build (the result stays in the cache),
  # then the runner's own platform again, loaded to smoke-test.
  images:
    name: Container images (amd64 and arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          web: "false"
          free-disk: "true"
      # No QEMU: the Dockerfile cross-compiles on the build platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64
          load: true
          tags: fleetops:ci
          cache-from: type=gha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64
          load: true
          tags: fleetops-agent:ci
          cache-from: type=gha
      - run: make image-smoke IMAGE=fleetops:ci
      - run: make agent-smoke IMAGE=fleetops:ci AGENT_IMAGE=fleetops-agent:ci
