# CI runs on pushes to the default branch and on merge requests. A tag
# vX.Y.Z (matching the workspace version in Cargo.toml) instead publishes
# the multi-arch server and agent images to Docker Hub (public; set the
# masked CI/CD variables DOCKERHUB_USERNAME and DOCKERHUB_TOKEN) and a
# release with static linux binaries of both. This project's own registry
# holds only the CI image and the build cache.
#
# Every job but the first runs in ci/Dockerfile's image, built at the start
# of the pipeline. Jobs that need Docker start a daemon in their own
# container (ci/start-docker.sh), so the Makefile targets run unchanged.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  auto_cancel:
    on_new_commit: interruptible

stages: [prepare, test, release]

variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_REF_SLUG
  SERVER_IMAGE_REPO: docker.io/pravinbanjade/fleetops
  AGENT_IMAGE_REPO: docker.io/pravinbanjade/fleetops-agent
  BUILD_CACHE: $CI_REGISTRY_IMAGE/cache:build
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # pnpm's store, corepack's pnpm download and Playwright's browsers.
  XDG_DATA_HOME: $CI_PROJECT_DIR/.cache/data
  COREPACK_HOME: $CI_PROJECT_DIR/.cache/corepack
  PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast

default:
  image: $CI_IMAGE
  interruptible: true

.rust-cache: &rust-cache
  key:
    prefix: rust-$CI_JOB_NAME
    files: [Cargo.lock]
  paths: [.cargo/registry/index/, .cargo/registry/cache/, .cargo/git/db/, target/]

.web-cache: &web-cache
  key:
    prefix: web
    files: [web/pnpm-lock.yaml]
  paths: [.cache/]

.test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

.docker:
  before_script:
    - ci/start-docker.sh

.buildx:
  before_script:
    - ci/start-docker.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container

ci-image:
  stage: prepare
  image: docker:29
  services: [docker:29-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container
    - >
      docker buildx build ci/ --push --tag "$CI_IMAGE"
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/ci:cache"
      --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/ci:cache,mode=max,image-manifest=true,oci-mediatypes=true"

rust:
  extends: .test
  cache: [*rust-cache]
  script:
    - make lint
    - make test

docker-it:
  extends: [.test, .docker]
  cache: [*rust-cache]
  script:
    - make test-docker

web:
  extends: .test
  cache: [*web-cache]
  script:
    - make test-web

e2e:
  extends: [.test, .docker]
  cache: [*rust-cache, *web-cache]
  script:
    - pnpm -C web install --frozen-lockfile
    - make e2e
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [web/playwright-report/, web/test-results/]

kube:
  extends: [.test, .docker]
  timeout: 90m
  cache: [*rust-cache, *web-cache]
  script:
    - make test-kube
    - pnpm -C web install --frozen-lockfile
    - make e2e-kube
    - make image IMAGE=fleetops:dev PLATFORMS=linux/amd64
    - make image-agent AGENT_IMAGE=fleetops-agent:dev PLATFORMS=linux/amd64
    - make agent-kube-smoke
    - make rss-bench KUBE_IT_RSS=$CI_PROJECT_DIR/target/kube-it
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [web/playwright-report/]

# Idle memory: 50 containers, under 50 MiB.
rss:
  extends: [.test, .docker]
  cache: [*rust-cache, *web-cache]
  script:
    - make rss-bench

# Both platforms, to prove they build (the result stays in the registry
# cache), then the runner's own platform again, loaded to smoke-test.
image:
  extends: [.test, .buildx]
  script:
    - >
      docker buildx build . --target server --platform linux/amd64,linux/arm64
      --cache-from "type=registry,ref=$BUILD_CACHE"
      --cache-to "type=registry,ref=$BUILD_CACHE,mode=max,image-manifest=true,oci-mediatypes=true"
    - >
      docker buildx build . --target agent --platform linux/amd64,linux/arm64
      --cache-from "type=registry,ref=$BUILD_CACHE"
    - docker buildx build . --target server --platform linux/amd64 --load --tag fleetops:ci --cache-from "type=registry,ref=$BUILD_CACHE"
    - docker buildx build . --target agent --platform linux/amd64 --load --tag fleetops-agent:ci --cache-from "type=registry,ref=$BUILD_CACHE"
    - make image-smoke IMAGE=fleetops:ci
    - make agent-smoke IMAGE=fleetops:ci AGENT_IMAGE=fleetops-agent:ci

# Pushes the images and uploads the binaries to the generic package
# registry, where the release below links them.
publish:
  stage: release
  extends: .buildx
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - |
      version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
      [ "v$version" = "$CI_COMMIT_TAG" ] || { echo "tag $CI_COMMIT_TAG, Cargo.toml $version" >&2; exit 1; }
      labels="--label org.opencontainers.image.source=$CI_PROJECT_URL --label org.opencontainers.image.version=$version --label org.opencontainers.image.revision=$CI_COMMIT_SHA"
      tags() { echo "--tag $1:$version --tag $1:${version%.*} --tag $1:latest"; }
    - >
      docker buildx build . --target server --platform linux/amd64,linux/arm64 --push
      $(tags "$SERVER_IMAGE_REPO") $labels
      --cache-from "type=registry,ref=$BUILD_CACHE"
      --cache-to "type=registry,ref=$BUILD_CACHE,mode=max,image-manifest=true,oci-mediatypes=true"
    - >
      docker buildx build . --target agent --platform linux/amd64,linux/arm64 --push
      $(tags "$AGENT_IMAGE_REPO") $labels
      --cache-from "type=registry,ref=$BUILD_CACHE"
    # The same build (cache hits), stopped at the bare-binary stages.
    - docker buildx build . --target binary --platform linux/amd64,linux/arm64 --output type=local,dest=out --cache-from "type=registry,ref=$BUILD_CACHE"
    - docker buildx build . --target agent-binary --platform linux/amd64,linux/arm64 --output type=local,dest=out-agent --cache-from "type=registry,ref=$BUILD_CACHE"
    - |
      mkdir dist
      for arch in amd64 arm64; do
        name=fleetops-$CI_COMMIT_TAG-linux-$arch
        cp out/linux_$arch/fleetops "dist/$name"
        (cd dist && sha256sum "$name" > "$name.sha256")
        agent=fleetops-agent-$CI_COMMIT_TAG-linux-$arch
        cp out-agent/linux_$arch/fleetops-agent "dist/$agent"
        (cd dist && sha256sum "$agent" > "$agent.sha256")
      done
      echo "VERSION=$version" > release.env
      for f in dist/*; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/fleetops/$CI_COMMIT_TAG/$(basename "$f")"
      done
  artifacts:
    reports:
      dotenv: release.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: false
  needs: [publish]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    PACKAGE: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/fleetops/$CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: FleetOps $CI_COMMIT_TAG
    description: "Images `$SERVER_IMAGE_REPO:$VERSION` and `$AGENT_IMAGE_REPO:$VERSION` for linux/amd64 and linux/arm64, and static linux binaries of both with SHA-256 checksums."
    assets:
      links:
        - { name: fleetops-$CI_COMMIT_TAG-linux-amd64, url: $PACKAGE/fleetops-$CI_COMMIT_TAG-linux-amd64, link_type: package }
        - { name: fleetops-$CI_COMMIT_TAG-linux-amd64.sha256, url: $PACKAGE/fleetops-$CI_COMMIT_TAG-linux-amd64.sha256, link_type: other }
        - { name: fleetops-$CI_COMMIT_TAG-linux-arm64, url: $PACKAGE/fleetops-$CI_COMMIT_TAG-linux-arm64, link_type: package }
        - { name: fleetops-$CI_COMMIT_TAG-linux-arm64.sha256, url: $PACKAGE/fleetops-$CI_COMMIT_TAG-linux-arm64.sha256, link_type: other }
        - { name: fleetops-agent-$CI_COMMIT_TAG-linux-amd64, url: $PACKAGE/fleetops-agent-$CI_COMMIT_TAG-linux-amd64, link_type: package }
        - { name: fleetops-agent-$CI_COMMIT_TAG-linux-amd64.sha256, url: $PACKAGE/fleetops-agent-$CI_COMMIT_TAG-linux-amd64.sha256, link_type: other }
        - { name: fleetops-agent-$CI_COMMIT_TAG-linux-arm64, url: $PACKAGE/fleetops-agent-$CI_COMMIT_TAG-linux-arm64, link_type: package }
        - { name: fleetops-agent-$CI_COMMIT_TAG-linux-arm64.sha256, url: $PACKAGE/fleetops-agent-$CI_COMMIT_TAG-linux-arm64.sha256, link_type: other }
