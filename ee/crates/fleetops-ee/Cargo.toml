[package]
name = "fleetops-ee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish = false

[features]
# Trust the committed test key. Unit tests and the EE e2e suite only;
# release builds never enable it.
test-license-key = []
# The OpenLDAP suite (make test-ldap).
ldap-it = []
# The MinIO suite (make test-s3).
s3-it = []

[dependencies]
fleetops-core.workspace = true
fleetops-store.workspace = true
fleetops-api.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
ldap3.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
rusty-s3.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
http-body-util.workspace = true
rand.workspace = true
tempfile.workspace = true
tower.workspace = true
wiremock.workspace = true

[[test]]
name = "ldap_it"
required-features = ["ldap-it"]

[[test]]
name = "s3_it"
required-features = ["s3-it"]
